<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Humps, Extended</title>
<style>
:root { --bg: #f6f4ef; --fg: #1d1c1a; --muted: #6b675f; --card: #ffffff; --line: #e2ded5; --accent: #2f5d8a; }
@media (prefers-color-scheme: dark) { :root { --bg: #151514; --fg: #ecebe7; --muted: #9a968e; --card: #1f1f1d; --line: #33322f; --accent: #8fb6dc; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 28px; line-height: 1.2; margin: 24px 0 8px; }
p { color: var(--muted); margin: 0 0 16px; }
.video { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; }
.video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.player { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 16px; }
audio { width: 100%; }
ol { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 4px; }
button { width: 100%; display: flex; gap: 12px; text-align: left; background: none; border: 0; border-radius: 6px; padding: 6px 8px; color: var(--fg); font: inherit; cursor: pointer; }
button:hover, button.on { background: var(--line); }
button span:first-child { font-variant-numeric: tabular-nums; color: var(--accent); min-width: 3em; }
.links { margin-top: 16px; font-size: 14px; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/w6szQQEFzC8" title="Michael Scott My Humps ringtone" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
<h1>My Humps: the Michael Scott ringtone, extended</h1>
<p>The ringtone from The Office is 23 seconds long. This is 3 minutes of it, rebuilt from the transcribed melody and synthesized from scratch.</p>
<div class="player">
<audio id="a" controls preload="metadata" src="my-humps-extended.mp3"></audio>
<ol id="s"></ol>
</div>
<p class="links"><a href="my-humps-extended.mp3" download>mp3</a> · <a href="my-humps-extended.mid" download>MIDI</a> · <a href="https://github.com/radres/michael-scott-my-humps">source</a></p>
</main>
<script>
const parts = [[0, "intro"], [15.5, "hook"], [23.2, "chorus"], [38.7, "verse"], [54.2, "hook + chorus, octave bells"], [77.4, "solo"], [92.9, "chorus with harmony"], [108.4, "breakdown"], [123.9, "key change"], [162.6, "outro"]];
const a = document.getElementById("a"), s = document.getElementById("s");
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const btns = parts.map(([t, name]) => {
  const li = document.createElement("li"), b = document.createElement("button");
  b.innerHTML = `<span>${fmt(t)}</span><span>${name}</span>`;
  b.onclick = () => { a.currentTime = t; a.play(); };
  li.append(b); s.append(li); return b;
});
a.addEventListener("timeupdate", () => {
  let i = parts.findLastIndex(([t]) => a.currentTime >= t);
  btns.forEach((b, k) => b.classList.toggle("on", k === i));
});
</script>
</body>
</html>
